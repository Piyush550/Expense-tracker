/* Layout: a single ledger column. Month bar on top, then who-pays-whom beside the balance table, then the month's expense log. */

input[type="text"], input[type="date"], select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }

.amtwrap input { padding-left: 26px; font-family: var(--font-mono); }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }

.pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pick:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--surface); }

.formfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; }
.formfoot .grow { flex: 1; min-width: 160px; color: var(--muted); font-size: 13px; }
.err { color: var(--neg); font-weight: 600; font-size: 13px; }
.quick { font-size: 13px; font-weight: 400; color: var(--muted); }
.quick button { font-size: 13px; }

.setup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 14px 0; }
.banner { border-radius: 8px; padding: 12px 14px; background: var(--surface-2); }
.banner.warn { background: var(--neg-bg); color: var(--neg); font-weight: 600; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: calc(100% - 32px); z-index: 20; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

@media (max-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .x { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "main amt" "date who" "with with" "act act"; }
  .x-main { grid-area: main; } .x-amt { grid-area: amt; } .x-date { grid-area: date; } .x-who { grid-area: who; justify-self: end; }
  .x-with { grid-area: with; } .x-act { grid-area: act; justify-content: flex-start; }
  .formgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

@media (max-width: 460px) {
  h1 { font-size: 26px; }

:root { color-scheme: light; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }

@media (max-width: 460px) {
  .tools { width: 100%; flex-wrap: nowrap; }
  .monthnav { width: auto; flex: 1; min-width: 0; }
  .themebtn { padding: 0 12px; }
  .themebtn span { display: none; }
}

    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });

// Split and settlement logic. All money is integer paise.
function splitShares(paise, ids) {
  const s = [...ids].sort();
  const n = s.length;
  const base = Math.floor(paise / n);
  const rem = paise - base * n;
  const out = {};
  s.forEach((id, i) => { out[id] = base + (i < rem ? 1 : 0); });
  return out;
}

// Largest number of zero-sum groups the non-zero balances can be split into.
// Each group of k people needs k-1 payments, so more groups means fewer payments.
function zeroSumGroups(vals) {
  const m = vals.length;
  const N = 1 << m;
  const sum = new Float64Array(N);
  const dp = new Int16Array(N);
  const prev = new Int8Array(N);
  for (let mask = 1; mask < N; mask++) {
    const low = 31 - Math.clz32(mask & -mask);
    sum[mask] = sum[mask ^ (1 << low)] + vals[low];
    let best = -1, bj = 0;
    for (let j = 0; j < m; j++) {
      if (mask & (1 << j)) {
        const v = dp[mask ^ (1 << j)];
        if (v > best) { best = v; bj = j; }
      }
    }
    dp[mask] = best + (sum[mask] === 0 ? 1 : 0);
    prev[mask] = bj;
  }
  const seq = [];
  let mask = N - 1;
  while (mask) { const j = prev[mask]; seq.push(j); mask ^= (1 << j); }
  seq.reverse();
  const groups = [];
  let cur = [], run = 0;
  for (const j of seq) {
    cur.push(j); run += vals[j];
    if (run === 0) { groups.push(cur); cur = []; }
  }
  if (cur.length) groups.push(cur);
  return groups;
}

function minTransfers(net) {
  const people = Object.keys(net).filter(id => net[id] !== 0).sort();
  if (!people.length) return [];
  const groups = people.length <= 16
    ? zeroSumGroups(people.map(id => net[id])).map(g => g.map(i => people[i]))
    : [people];
  const byAmt = (a, b) => (b.amt - a.amt) || (a.id < b.id ? -1 : 1);
  const out = [];
  for (const g of groups) {
    const debt = g.filter(id => net[id] < 0).map(id => ({ id, amt: -net[id] }));
    const cred = g.filter(id => net[id] > 0).map(id => ({ id, amt: net[id] }));
    while (debt.length && cred.length) {
      debt.sort(byAmt); cred.sort(byAmt);
      const d = debt[0], c = cred[0];
      const amt = Math.min(d.amt, c.amt);
      out.push({ from: d.id, to: c.id, paise: amt });
      d.amt -= amt; c.amt -= amt;
      if (d.amt === 0) debt.shift();
      if (c.amt === 0) cred.shift();
    }
  }
  return out;
}

function computeMonth(expenses, memberIds) {
  const paid = {}, share = {}, net = {};
  memberIds.forEach(id => { paid[id] = 0; share[id] = 0; });
  for (const e of expenses) {
    const ppl = (e.people || []).filter(Boolean);
    if (!ppl.length || !(e.paise > 0)) continue;
    paid[e.payer] = (paid[e.payer] || 0) + e.paise;
    const sh = splitShares(e.paise, ppl);
    for (const id in sh) share[id] = (share[id] || 0) + sh[id];
  }
  new Set([...Object.keys(paid), ...Object.keys(share)]).forEach(id => {
    paid[id] = paid[id] || 0; share[id] = share[id] || 0; net[id] = paid[id] - share[id];
  });
  return { paid, share, net, transfers: minTransfers(net) };
}

  function pad2(n) { return String(n).padStart(2, "0"); }

  var S = {
    root: null, members: [], expenses: [], settled: {},

  function allReady() { return S.ready.g && S.ready.e && S.ready.s; }

  /* ---------- light / dark theme (light is the default) ---------- */

      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  }

  function renderHead() {
    var ms = monthExpenses(), calc = currentCalc();

  function renderSettle() {
    var el = $("settle");

    var head = '<div class="sechead"><h2>Settle up for ' + esc(monthLabel(S.month)) + "</h2>" +

    if (!S.ready.e) { el.innerHTML = head + '<div class="card muted">Loading the ledger…</div>'; return; }

    var calc = currentCalc(), ts = calc.transfers;

    var done = S.settled[S.month] || {};

  /* ---------- expense form ---------- */
  function openForm(id) {
    var e = id ? S.expenses.filter(function (x) { return x.id === id; })[0] : null;
    S.editing = e ? e.id : null;
    var lastPayer = lsGet("outing-ledger-payer");
    var payer = e ? e.payer : (memberIdx(lastPayer) >= 0 ? lastPayer : S.members[0].id);
    var people = e ? e.people : S.members.map(function (m) { return m.id; });
    var defDate = e ? e.date : (S.month === ymNow() ? todayStr() : S.month + "-01");
    var payOpts = S.members.map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === payer ? " selected" : "") + ">" + esc(m.name) + "</option>"; }).join("");
    var picks = S.members.map(function (m) {
      return '<label class="pick"><input type="checkbox" name="person" value="' + esc(m.id) + '"' + (people.indexOf(m.id) >= 0 ? " checked" : "") + ">" + chip(m.id, true) + "<span>" + esc(m.name) + "</span></label>";
    }).join("");
    var amtVal = e ? String(e.paise / 100) : "";
    var w = $("formWrap");
    w.innerHTML = '<form class="card formcard" id="expForm" novalidate><div class="sechead"><h2>' + (e ? "Edit expense" : "New expense") + "</h2></div>" +
      '<div class="formgrid">' +
      '<div class="field"><label for="f-date">Date</label><input type="date" id="f-date" value="' + esc(defDate) + '" required></div>' +
      '<div class="field name"><label for="f-name">Name of the expense</label><input type="text" id="f-name" maxlength="80" placeholder="Dinner at Social, cab to airport…" value="' + esc(e ? e.name : "") + '" autocomplete="off" required></div>' +
      '<div class="field"><label for="f-amt">Amount</label><div class="amtwrap"><span>₹</span><input type="text" id="f-amt" inputmode="decimal" placeholder="0" value="' + esc(amtVal) + '" autocomplete="off" required></div></div>' +
      '<div class="field"><label for="f-payer">Paid by</label><select id="f-payer">' + payOpts + "</select></div>" +
      '<div class="field full"><div class="legend">People involved <span class="quick">· <button type="button" class="linkbtn" data-act="pick-all">everyone</button> · <button type="button" class="linkbtn" data-act="pick-none">clear</button></span></div><div class="picks" role="group" aria-label="People involved">' + picks + "</div></div>" +
      '<div class="field full"><label for="f-rem">Remarks</label><textarea id="f-rem" rows="2" maxlength="200" placeholder="Optional. Who ordered extra, what the bill included…">' + esc(e ? e.remarks || "" : "") + "</textarea></div></div>" +
      '<div class="formfoot"><button type="submit" class="btn primary" id="f-save">' + (e ? "Save changes" : "Add expense") + '</button><button type="button" class="btn" data-act="form-cancel">Cancel</button><span class="grow" id="f-note"></span></div><div class="err" id="f-err" style="margin-top:8px"></div></form>';
    w.hidden = false; updateSplitNote();
    $("f-name").focus();
    w.scrollIntoView({ block: "nearest" });
  }
  function closeForm() { S.editing = null; var w = $("formWrap"); w.hidden = true; w.innerHTML = ""; }
  function parseAmount(v) {
    v = String(v || "").replace(/[,\s₹]/g, "");
    if (!/^\d+(\.\d{1,2})?$/.test(v)) return 0;
    return Math.round(parseFloat(v) * 100);
  }
  function checkedPeople() {
    return Array.prototype.slice.call(document.querySelectorAll("#formWrap input[name=person]:checked")).map(function (i) { return i.value; });
  }
  function updateSplitNote() {
    var n = $("f-note"); if (!n) return;
    var p = parseAmount($("f-amt").value), c = checkedPeople().length;
    if (!c) n.textContent = "Pick at least one person to split between.";
    else if (!p) n.textContent = c + (c === 1 ? " person" : " people") + " selected.";
    else n.textContent = "Split equally: about " + money(Math.round(p / c)) + " each between " + c + (c === 1 ? " person." : " people.");
  }
  function saveExpense() {
    var date = $("f-date").value, name = $("f-name").value.trim(), paise = parseAmount($("f-amt").value);
    var payer = $("f-payer").value, people = checkedPeople(), rem = $("f-rem").value.trim();
    var err = $("f-err");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { err.textContent = "Choose the date of the expense."; return; }
    if (!name) { err.textContent = "Give the expense a name."; $("f-name").focus(); return; }
    if (!paise) { err.textContent = "Enter an amount above zero, like 1250 or 1250.50."; $("f-amt").focus(); return; }
    if (!people.length) { err.textContent = "Select at least one person who shared this expense."; return; }
    var old = S.editing ? S.expenses.filter(function (x) { return x.id === S.editing; })[0] : null;
    var id = S.editing || S.root.child("expenses").push().key;
    var now = Date.now();
    var pm = {}; people.forEach(function (p) { pm[p] = true; });
    var wasEdit = !!S.editing;
    lsSet("outing-ledger-payer", payer);
    S.month = date.slice(0, 7);
    S.root.child("expenses/" + id).set({ date: date, name: name, paise: paise, payer: payer, people: pm, remarks: rem, createdAt: old && old.createdAt ? old.createdAt : now, updatedAt: now })
      .catch(function (e) { toast(errText(e)); });
    closeForm(); render(); toast(wasEdit ? "Expense updated" : "Expense added");
  }

  /* ---------- actions ---------- */
  function membersToObj(list) {
    var o = {}; list.forEach(function (m, i) { o[m.id] = { name: m.name, order: i }; }); return o;
  }
  function createGroup() {
    var names = [];
    for (var i = 0; i < 6; i++) { var el = $("su-" + i); var v = el ? el.value.trim() : ""; if (v) names.push(v); }
    var err = $("su-err");
    if (names.length < 2) { err.textContent = "Enter at least two names."; return; }
    var seen = {}; for (var j = 0; j < names.length; j++) { var k = names[j].toLowerCase(); if (seen[k]) { err.textContent = "Two people have the same name. Make them different, like Amit R and Amit K."; return; } seen[k] = 1; }
    var base = Date.now().toString(36);
    var members = names.map(function (n, i) { return { id: "m" + base + i, name: n }; });
    S.root.child("members").set(membersToObj(members)).then(function () { toast("Group created"); })
      .catch(function (e) { err.textContent = errText(e); });
  }
  function saveGroup() {
    var err = $("gm-err");
    var members = S.members.map(function (m) { var el = $("gm-" + m.id); return { id: m.id, name: (el && el.value.trim()) || m.name }; });
    var add = $("gm-new").value.trim();
    if (add) members.push({ id: "m" + Date.now().toString(36) + members.length, name: add });
    var seen = {};
    for (var i = 0; i < members.length; i++) { var k = members[i].name.toLowerCase(); if (seen[k]) { err.textContent = "Two people have the same name. Make them different."; return; } seen[k] = 1; }
    if (members.length > 12) { err.textContent = "The group can have up to 12 people."; return; }
    S.root.child("members").set(membersToObj(members)).catch(function (e) { toast(errText(e)); });
    S.groupOpen = false; render(); toast("Members saved");
  }
  function togglePaid(key, on) {
    var ref = S.root.child("settled/" + S.month + "/" + key);
    (on ? ref.set(true) : ref.remove()).catch(function (e) { toast(errText(e)); });
  }
  function deleteExpense(id) {
    S.delId = null;
    S.root.child("expenses/" + id).remove().catch(function (e) { toast(errText(e)); });
    toast("Expense deleted");
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta); toast(ok ? "Summary copied" : "Could not copy. Select the payments and copy them by hand.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("Summary copied"); }, fallback);
    } else fallback();
  }
  function copySummary() {
    var ms = monthExpenses(), calc = currentCalc(), done = S.settled[S.month] || {};
    var total = ms.reduce(function (a, e) { return a + e.paise; }, 0);
    var lines = ["Expense Tracker – " + monthLabel(S.month), "Total spent: " + money(total), ""];
    if (!calc.transfers.length) lines.push("Everyone is square.");
    else { lines.push("Settle up:"); calc.transfers.forEach(function (t) { lines.push(mName(t.from) + " pays " + mName(t.to) + " " + money(t.paise) + (done[tKey(t)] ? " (paid)" : "")); }); }
    copyText(lines.join("\n"));
  }
  function csvCell(v) {
    v = String(v == null ? "" : v);
    if (/^[=+\-@]/.test(v)) v = "'" + v;
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function downloadCsv(all) {
    var list = (all ? S.expenses.slice() : monthExpenses().slice())
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0); });
    var rows = [["Date", "Expense", "Amount (INR)", "Paid by", "People involved", "Remarks"]];
    list.forEach(function (e) {
      rows.push([e.date, e.name, (e.paise / 100).toFixed(2), mName(e.payer), (e.people || []).map(mName).join("; "), e.remarks || ""]);
    });
    var text = "﻿" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
    var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "expense-tracker-" + (all ? "all" : S.month) + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("Download started");
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]"); if (!b) { if (S.delId) { S.delId = null; renderLog(); } return; }
    var act = b.getAttribute("data-act");
    if (act !== "del" && S.delId) { S.delId = null; renderLog(); }
    switch (act) {
      case "theme": setTheme(currentTheme() === "dark" ? "light" : "dark"); break;
      case "prev": S.month = shiftMonth(S.month, -1); render(); break;
      case "next": S.month = shiftMonth(S.month, 1); render(); break;
      case "add": openForm(null); break;
      case "edit": openForm(b.getAttribute("data-id")); break;
      case "form-cancel": closeForm(); break;
      case "pick-all": Array.prototype.forEach.call(document.querySelectorAll("#formWrap input[name=person]"), function (i) { i.checked = true; }); updateSplitNote(); break;
      case "pick-none": Array.prototype.forEach.call(document.querySelectorAll("#formWrap input[name=person]"), function (i) { i.checked = false; }); updateSplitNote(); break;
      case "del": {
        var id = b.getAttribute("data-id");
        if (S.delId === id) deleteExpense(id); else { S.delId = id; renderLog(); }
        break;
      }
      case "paid": togglePaid(b.getAttribute("data-key"), b.checked); break;
      case "copy": copySummary(); break;
      case "csv-month": downloadCsv(false); break;
      case "csv-all": downloadCsv(true); break;
      case "create-group": createGroup(); break;
      case "group-open": S.groupOpen = true; renderGroup(); break;
      case "group-close": S.groupOpen = false; renderGroup(); break;
      case "group-save": saveGroup(); break;
    }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "monthSel") { S.month = ev.target.value; render(); }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.closest && ev.target.closest("#expForm")) updateSplitNote();
  });
  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (ev.target.id === "expForm") saveExpense();
  });

  /* ---------- live data from Firebase ---------- */
  function onErr(e) {
    S.err = /permission/i.test((e && (e.code || e.message)) || "")
      ? "The database refused to share its data. Open Rules in the Firebase console and publish the rules from the setup guide."
      : "Could not load the ledger right now. Reload the page to try again.";
    S.ready = { g: true, e: true, s: true }; render();
  }
  function start() {
    if (!DB_URL || /PASTE_YOUR/.test(DB_URL)) { S.setup = true; S.ready = { g: true, e: true, s: true }; render(); return; }
    if (typeof firebase === "undefined") { S.err = "Could not load Firebase. Check your internet connection and reload."; S.ready = { g: true, e: true, s: true }; render(); return; }
    try {
      firebase.initializeApp({ databaseURL: DB_URL });
      var database = firebase.database();
      S.root = database.ref("ledger");
      database.ref(".info/connected").on("value", function (s) { S.online = s.val() === true; renderBanner(); });
      S.root.child("members").on("value", function (snap) {
        var v = snap.val() || {};
        S.members = Object.keys(v).map(function (id) { return { id: id, name: String((v[id] && v[id].name) || "Unnamed"), order: (v[id] && v[id].order) || 0 }; })
          .sort(function (a, b) { return a.order - b.order; });
        S.ready.g = true; render();
      }, onErr);
      S.root.child("expenses").on("value", function (snap) {
        var v = snap.val() || {};
        S.expenses = Object.keys(v).map(function (id) {
          var x = v[id] || {};
          return { id: id, date: x.date, name: x.name, paise: x.paise, payer: x.payer, people: Object.keys(x.people || {}), remarks: x.remarks || "", createdAt: x.createdAt || 0 };
        });
        S.ready.e = true; render();
      }, onErr);
      S.root.child("settled").on("value", function (snap) {
        S.settled = snap.val() || {}; S.ready.s = true; render();
      }, onErr);
    } catch (e) {
      S.err = "Could not connect to the database. Check the address you pasted into the file."; S.ready = { g: true, e: true, s: true }; render();
    }
  }
  render();
  start();
})();

</script>
