<style>
/* Layout: a single ledger column. Month bar on top, then who-pays-whom beside the balance table, then the month's expense log. */
:root {
  --bg: #EDF1EF;
  --surface: #FFFFFF;
  --surface-2: #E4EAE7;

  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;

}
* { box-sizing: border-box; }

.wrap { max-width: 1040px; margin: 0 auto; padding-block: 22px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.titlebar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.sub { margin: 6px 0 0; color: var(--muted); }

.stats dt { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }

.sechead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }

.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.chip.sm { width: 22px; height: 22px; font-size: 10px; }
.who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }

.debtor { padding: 0; overflow: hidden; }

.debtor > header .who strong { overflow-wrap: anywhere; }
.amt { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }

th.r, td.r { text-align: right; padding-right: 0; }

.log { list-style: none; margin: 0; padding: 0; }
.x { display: grid; grid-template-columns: 92px minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) 104px auto; gap: 8px 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.x:first-child { border-top: 0; }
.x-date { color: var(--muted); font-size: 13px; }
.x-main { min-width: 0; display: flex; flex-direction: column; }
.x-main strong { overflow-wrap: anywhere; }
.rem { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.x-with { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; align-items: center; }
.x-amt { text-align: right; }
.x-amt small { display: block; color: var(--muted); font-family: var(--font-mono); font-size: 11px; font-weight: 400; }
.x-act { display: flex; gap: 6px; justify-content: flex-end; }
.lbl { color: var(--muted); font-size: 12px; margin-right: 4px; }
.empty { color: var(--muted); padding: 22px 16px; }

.formcard { border-color: var(--accent); }

.field.full { grid-column: 1 / -1; }
.field > label, .field > .legend { font-size: 13px; font-weight: 600; }
input[type="text"], input[type="email"], input[type="password"], input[type="date"], select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
textarea { resize: vertical; min-height: 42px; }
.amtwrap { position: relative; }
.amtwrap span { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.amtwrap input { padding-left: 26px; font-family: var(--font-mono); }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { position: relative; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px 4px 5px; background: var(--bg); cursor: pointer; user-select: none; }

.err { color: var(--neg); font-weight: 600; font-size: 13px; }
.quick { font-size: 13px; font-weight: 400; color: var(--muted); }
.quick button { font-size: 13px; }

.setup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 14px 0; }
.banner { border-radius: 8px; padding: 12px 14px; background: var(--surface-2); }
.banner.warn { background: var(--neg-bg); color: var(--neg); font-weight: 600; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: calc(100% - 32px); z-index: 20; }

@media (max-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .x { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "main amt" "date who" "with with" "act act"; }
  .x-main { grid-area: main; } .x-amt { grid-area: amt; } .x-date { grid-area: date; } .x-who { grid-area: who; justify-self: end; }
  .x-with { grid-area: with; } .x-act { grid-area: act; justify-content: flex-start; }
  .formgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

  .monthnav { width: 100%; } .monthnav select { flex: 1; min-width: 0; }
}

:root { color-scheme: light; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.headbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.steps { margin: 12px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.themebtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 14px; font-weight: 600; }
.themebtn:hover { background: var(--surface-2); }
.authcard { width: 100%; max-width: 440px; margin: 12px auto 0; }
.authform { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.authform .formfoot { margin-top: 4px; }
.authmsg { margin: 10px 0 0; font-size: 13px; color: var(--pos); font-weight: 600; }
.authmsg:empty, .err:empty { display: none; }
.claimbtn { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 6px; border-radius: 99px; }
.claimbtn.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.acct { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.acct-links { display: inline-flex; gap: 16px; }
.groupbtns { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
.btn.small.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.grouplist { list-style: none; margin: 0; padding: 0; }
.grouprow { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 2fr) auto; gap: 8px 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.grouprow:first-child { border-top: 0; }
.grouprow strong { overflow-wrap: anywhere; }
@media (max-width: 600px) { .grouprow { grid-template-columns: minmax(0, 1fr) auto; } .grouprow .x-with { grid-column: 1 / -1; grid-row: 2; } }
@media (max-width: 460px) {
  .tools { width: 100%; flex-wrap: nowrap; }
  .monthnav { width: auto; flex: 1; min-width: 0; }
  .themebtn { padding: 0 12px; }
  .themebtn span { display: none; }
}

// Split and settlement logic. All money is integer paise.
function splitShares(paise, ids) {
  const s = [...ids].sort();
  const n = s.length;
  const base = Math.floor(paise / n);
  const rem = paise - base * n;
  const out = {};
  s.forEach((id, i) => { out[id] = base + (i < rem ? 1 : 0); });
  return out;
}

// Largest number of zero-sum groups the non-zero balances can be split into.
// Each group of k people needs k-1 payments, so more groups means fewer payments.
function zeroSumGroups(vals) {
  const m = vals.length;
  const N = 1 << m;
  const sum = new Float64Array(N);
  const dp = new Int16Array(N);

    cur.push(j); run += vals[j];
    if (run === 0) { groups.push(cur); cur = []; }
  }
  if (cur.length) groups.push(cur);
  return groups;
}

function minTransfers(net) {
  const people = Object.keys(net).filter(id => net[id] !== 0).sort();
  if (!people.length) return [];
  const groups = people.length <= 16
    ? zeroSumGroups(people.map(id => net[id])).map(g => g.map(i => people[i]))
    : [people];
  const byAmt = (a, b) => (b.amt - a.amt) || (a.id < b.id ? -1 : 1);
  const out = [];
  for (const g of groups) {
    const debt = g.filter(id => net[id] < 0).map(id => ({ id, amt: -net[id] }));
    const cred = g.filter(id => net[id] > 0).map(id => ({ id, amt: net[id] }));
    while (debt.length && cred.length) {
      debt.sort(byAmt); cred.sort(byAmt);
      const d = debt[0], c = cred[0];
      const amt = Math.min(d.amt, c.amt);
      out.push({ from: d.id, to: c.id, paise: amt });
      d.amt -= amt; c.amt -= amt;
      if (d.amt === 0) debt.shift();
      if (c.amt === 0) cred.shift();
    }
  }
  return out;
}

function computeMonth(expenses, memberIds) {
  const paid = {}, share = {}, net = {};
  memberIds.forEach(id => { paid[id] = 0; share[id] = 0; });
  for (const e of expenses) {
    const ppl = (e.people || []).filter(Boolean);
    if (!ppl.length || !(e.paise > 0)) continue;
    paid[e.payer] = (paid[e.payer] || 0) + e.paise;
    const sh = splitShares(e.paise, ppl);
    for (const id in sh) share[id] = (share[id] || 0) + sh[id];
  }

    paid[id] = paid[id] || 0; share[id] = share[id] || 0; net[id] = paid[id] - share[id];
  });
  return { paid, share, net, transfers: minTransfers(net) };
}

  function who(id) { return '<span class="who">' + chip(id) + "<strong>" + esc(mName(id)) + "</strong></span>"; }

  function monthExpenses() {
    return S.expenses.filter(function (e) { return (e.date || "").slice(0, 7) === S.month; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0); });
  }
  function monthList() {
    var set = {}; set[ymNow()] = 1; set[S.month] = 1;
    S.expenses.forEach(function (e) { if (e.date) set[e.date.slice(0, 7)] = 1; });
    return Object.keys(set).sort().reverse();
  }
  function currentCalc() { return computeMonth(monthExpenses(), []); }
  function tKey(t) { return t.from + "_" + t.to + "_" + t.paise; }

  var toastTimer = null;

  function errText(e) {
    var c = e && (e.code || e.message || "");

  }
  function authErr(e) {
    var c = (e && e.code) || "";
    var m = {
      "auth/email-already-in-use": "An account with this email already exists. Sign in instead.",
      "auth/invalid-email": "That email address does not look right.",
      "auth/weak-password": "Pick a stronger password, at least 6 characters.",
      "auth/wrong-password": "Wrong email or password.",
      "auth/user-not-found": "Wrong email or password.",
      "auth/invalid-credential": "Wrong email or password.",
      "auth/invalid-login-credentials": "Wrong email or password.",
      "auth/user-disabled": "This account has been disabled.",
      "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again.",
      "auth/network-request-failed": "No connection. Check your internet and try again.",
      "auth/operation-not-allowed": "Email sign-in is not switched on. Enable Email/Password under Authentication in the Firebase console.",
      "auth/invalid-api-key": "The API key in this file is wrong. Copy it again from the Firebase console.",
      "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "The API key in this file is wrong. Copy it again from the Firebase console."
    };
    return m[c] || "Something went wrong. Try again.";
  }

  /* ---------- rendering ---------- */
  /* ---------- light / dark theme (light is the default) ---------- */
  function currentTheme() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
  function setTheme(t) {
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");

    renderHead();

  function themeButton() {
    var dark = currentTheme() === "dark";

      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    return '<button type="button" class="themebtn" data-act="theme" aria-label="Switch to ' + (dark ? "light" : "dark") + ' theme" title="Switch to ' + (dark ? "light" : "dark") + ' theme">' + icon + "<span>" + (dark ? "Light" : "Dark") + "</span></button>";
  }

  function renderHead() {

    var n = S.users.length;
    if (ready) {
      var ms = monthExpenses(), calc = currentCalc();

      }).join("");

        '<button type="button" data-act="next" aria-label="Next month">›</button></div>';
      stats = '<dl class="stats" style="margin-top:18px"><div><dt>Spent in ' + esc(monthLabel(S.month)) + "</dt><dd>" + money(total) + "</dd></div>" +
        "<div><dt>Expenses</dt><dd>" + ms.length + "</dd></div>" +
        "<div><dt>Payments to settle</dt><dd>" + calc.transfers.length + "</dd></div></dl>";
    }
    $("head").innerHTML =
      '<div class="titlebar"><div><h1>Expense Tracker</h1><p class="sub">' +
      (ready && n ? n + (n === 1 ? " member" : " members") + ", equal splits, amounts in ₹" : "Shared expense tracker for the group") +
      '</p></div><div class="tools">' + tools + "</div></div>" + stats;
  }

  function setupGuide() {
    return '<div class="card"><h3 style="font-size:20px">Finish setting up sign-in</h3><p class="muted" style="margin:6px 0 0">Accounts use Firebase Authentication. Do this once in the Firebase console:</p>' +
      '<ol class="steps"><li>Authentication → Sign-in method: enable <strong>Email/Password</strong>.</li>' +

      "<li>Realtime Database → Rules: paste the contents of database.rules.json and publish.</li></ol></div>";
  }

  function renderBanner() {
    var h = "";
    if (S.setup) {
      h = setupGuide();
    } else if (S.err) {
      h = '<div class="banner warn">' + esc(S.err) + "</div>";
    } else if (S.phase !== "ready") {
      h = "";
    } else if (S.online === false && allReady()) {
      h = '<div class="banner">You are offline. Changes you make now will sync when the connection comes back.</div>';
    } else if (allReady() && me() && !me().legacyDone && unclaimedLegacy().length) {
      var btns = unclaimedLegacy().sort(byName).map(function (m) {
        var on = S.claimId === m.id;
        return '<button type="button" class="btn claimbtn' + (on ? " on" : "") + '" data-act="claim" data-id="' + esc(m.id) + '">' + chip(m.id, true) + "<span>" + (on ? "Yes, I am " : "") + esc(m.name) + "</span></button>";
      }).join("");
      h = '<div class="card"><h3 style="font-size:20px">Were you in the old group?</h3><p class="muted" style="margin:6px 0 0">This tracker used to have a fixed list of names. If one of them is you, pick it and every past expense under that name moves to your account.</p>' +
        '<div class="picks" style="margin:14px 0">' + btns + '</div><div class="formfoot" style="margin-top:0"><button type="button" class="btn" data-act="claim-skip">None of these, I am new</button></div></div>';
    }
    $("banner").innerHTML = h;

  /* ---------- sign in / sign up / verify ---------- */
  function authField(id, label, type, auto, extra) {
    return '<div class="field"><label for="' + id + '">' + label + '</label><input type="' + type + '" id="' + id + '" autocomplete="' + auto + '"' + (extra || "") + "></div>";
  }
  function renderAuth() {
    var key = S.setup || (S.err && S.phase === "loading") ? "none" : S.phase + ":" + S.authMode + ":" + (S.user ? S.user.uid : "");
    if (S.authKey === key) return;
    S.authKey = key;
    var el = $("auth"), h = "";
    var msgs = '<div class="err" id="a-err" style="margin-top:4px"></div><p class="authmsg" id="a-msg"></p>';
    if (key === "none" || S.phase === "ready") h = "";
    else if (S.phase === "loading") h = '<div class="card authcard muted">Checking your sign-in…</div>';
    else if (S.phase === "unverified") {
      h = '<div class="card authcard"><h3 style="font-size:20px">Verify your email</h3><p class="muted" style="margin:6px 0 0">We sent a verification link to <strong>' + esc(S.user.email) +
        "</strong>. Open it, then come back here. Check your spam folder if it is not in your inbox.</p>" +
        '<div class="formfoot"><button type="button" class="btn primary" id="a-submit" data-act="verify-check">I have verified my email</button><button type="button" class="btn" data-act="verify-resend">Resend email</button></div>' + msgs +
        '<p class="note">Wrong email? <button type="button" class="linkbtn" data-act="signout">Sign out</button> and sign up again.</p></div>';
    } else if (S.authMode === "signup") {
      h = '<div class="card authcard"><h3 style="font-size:20px">Create your account</h3><p class="muted" style="margin:6px 0 0">Everyone with an account can be added to expenses.</p>' +
        '<form class="authform" id="authForm" data-mode="signup" novalidate>' +
        authField("a-name", "Your name", "text", "name", ' maxlength="24" placeholder="What the group calls you"') +
        authField("a-email", "Email", "email", "email") +
        authField("a-pw", "Password", "password", "new-password", ' placeholder="At least 6 characters"') +
        authField("a-pw2", "Confirm password", "password", "new-password") +
        '<div class="formfoot"><button type="submit" class="btn primary" id="a-submit">Create account</button></div>' + msgs + "</form>" +
        '<p class="note">Already have an account? <button type="button" class="linkbtn" data-act="auth-mode" data-mode="signin">Sign in</button></p></div>';
    } else if (S.authMode === "reset") {
      h = '<div class="card authcard"><h3 style="font-size:20px">Reset your password</h3><p class="muted" style="margin:6px 0 0">We will email you a link to choose a new password.</p>' +
        '<form class="authform" id="authForm" data-mode="reset" novalidate>' + authField("a-email", "Email", "email", "email") +
        '<div class="formfoot"><button type="submit" class="btn primary" id="a-submit">Send reset link</button></div>' + msgs + "</form>" +
        '<p class="note"><button type="button" class="linkbtn" data-act="auth-mode" data-mode="signin">Back to sign in</button></p></div>';
    } else {
      h = '<div class="card authcard"><h3 style="font-size:20px">Sign in</h3><p class="muted" style="margin:6px 0 0">Use the email you signed up with.</p>' +
        '<form class="authform" id="authForm" data-mode="signin" novalidate>' + authField("a-email", "Email", "email", "email") + authField("a-pw", "Password", "password", "current-password") +
        '<div class="formfoot"><button type="submit" class="btn primary" id="a-submit">Sign in</button><button type="button" class="linkbtn" data-act="auth-mode" data-mode="reset">Forgot password?</button></div>' + msgs + "</form>" +
        '<p class="note">New here? <button type="button" class="linkbtn" data-act="auth-mode" data-mode="signup">Create an account</button></p></div>';
    }
    el.innerHTML = h;
  }
  function setAuthMsg(text, isErr) {
    var e = $("a-err"), m = $("a-msg");
    if (e) e.textContent = isErr ? text : "";
    if (m) m.textContent = isErr ? "" : text;
  }
  function setBusy(on) { S.busy = on; var b = $("a-submit"); if (b) b.disabled = on; }
  function val(id) { var el = $(id); return el ? el.value : ""; }
  function validEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }

  function signIn() {
    var email = val("a-email").trim(), pw = val("a-pw");
    if (!validEmail(email)) return setAuthMsg("Enter your email address.", true);
    if (!pw) return setAuthMsg("Enter your password.", true);
    setBusy(true); setAuthMsg("", false);
    S.auth.signInWithEmailAndPassword(email, pw).catch(function (e) { setBusy(false); setAuthMsg(authErr(e), true); });
  }
  function signUp() {
    var name = val("a-name").trim().slice(0, 24), email = val("a-email").trim(), pw = val("a-pw"), pw2 = val("a-pw2");
    if (!name) return setAuthMsg("Enter your name. It is what everyone sees on expenses.", true);
    if (!validEmail(email)) return setAuthMsg("Enter a valid email address.", true);
    if (pw.length < 6) return setAuthMsg("Use a password of at least 6 characters.", true);
    if (pw !== pw2) return setAuthMsg("The two passwords do not match.", true);
    setBusy(true); setAuthMsg("", false);
    // onAuthStateChanged switches to the verify screen as soon as the account exists.
    S.auth.createUserWithEmailAndPassword(email, pw).then(function (cred) {
      return cred.user.updateProfile({ displayName: name }).then(function () { return cred.user.sendEmailVerification(); });
    }).then(function () { setAuthMsg("Verification email sent.", false); }, function (e) { setBusy(false); setAuthMsg(authErr(e), true); });
  }
  function resetPassword() {
    var email = val("a-email").trim();
    if (!validEmail(email)) return setAuthMsg("Enter your email address.", true);
    setBusy(true);
    var done = function () { setBusy(false); setAuthMsg("If an account exists for " + email + ", a reset link is on its way.", false); };
    S.auth.sendPasswordResetEmail(email).then(done, function (e) {
      if (e && e.code === "auth/user-not-found") done(); else { setBusy(false); setAuthMsg(authErr(e), true); }
    });
  }
  function checkVerified(silent) {
    var u = S.auth.currentUser; if (!u || S.busy) return;
    if (!silent) setBusy(true);
    u.reload().then(function () {
      var cur = S.auth.currentUser;
      // Refresh the ID token so the database rules see email_verified = true.
      if (cur && cur.emailVerified) return cur.getIdToken(true).then(function () { onUser(cur); });
      if (!silent) { setBusy(false); setAuthMsg("Not verified yet. Open the link in the email first, then try again.", true); }
    }).catch(function (e) { if (!silent) { setBusy(false); setAuthMsg(authErr(e), true); } });
  }
  function resendVerification() {
    var u = S.auth.currentUser; if (!u) return;
    u.sendEmailVerification().then(function () { setAuthMsg("Sent a new link to " + u.email + ".", false); }, function (e) { setAuthMsg(authErr(e), true); });
  }

  function renderSettle() {
    var el = $("settle");
    var ms = monthExpenses();
    var head = '<div class="sechead"><h2>Settle up for ' + esc(monthLabel(S.month)) + "</h2>" +
      (ms.length ? '<button type="button" class="btn small" data-act="copy">Copy summary</button>' : "") + "</div>";
    if (!allReady()) { el.innerHTML = head + '<div class="card muted">Loading the ledger…</div>'; return; }
    if (!ms.length) { el.innerHTML = head + '<div class="card muted">No expenses in this month yet. Payments will appear here once someone adds one.</div>'; return; }
    var calc = currentCalc(), ts = calc.transfers;
    if (!ts.length) { el.innerHTML = head + '<div class="allsq">Everyone is square for this month.</div>'; return; }
    var done = S.settled[S.month] || {};
    var byFrom = {}, order = [];
    ts.forEach(function (t) { if (!byFrom[t.from]) { byFrom[t.from] = []; order.push(t.from); } byFrom[t.from].push(t); });
    var outstanding = 0;
    var cards = order.map(function (f) {
      var list = byFrom[f], total = 0;
      var rows = list.map(function (t) {
        var d = !!done[tKey(t)]; total += t.paise; if (!d) outstanding += t.paise;
        return '<li class="' + (d ? "done" : "") + '"><span class="who">pays ' + chip(t.to) + "<strong>" + esc(mName(t.to)) + '</strong></span><span class="amt">' + money(t.paise) + "</span>" +
          '<label class="paidbox"><input type="checkbox" data-act="paid" data-key="' + esc(tKey(t)) + '"' + (d ? " checked" : "") + "> Paid</label></li>";
      }).join("");
      return '<article class="card debtor"><header>' + who(f) + '<span><span class="muted">owes </span><span class="amt neg">' + money(total) + "</span></span></header><ul class=\"pays\">" + rows + "</ul></article>";
    }).join("");
    var foot = outstanding === 0
      ? '<div class="allsq" style="margin-top:12px">All payments for this month are marked paid.</div>'
      : '<p class="note">Fewest possible payments: ' + ts.length + ". Still to pay: " + money(outstanding) + ". Tick Paid after the money moves.</p>";
    el.innerHTML = head + cards + foot;
  }

  function renderBalances() {
    var el = $("balances");
    var head = '<div class="sechead"><h2>Who paid and who used</h2></div>';
    if (!allReady()) { el.innerHTML = head + '<div class="card muted">Loading…</div>'; return; }
    var calc = currentCalc();
    var ids = Object.keys(calc.net).map(function (id) { return { id: id, name: mName(id) }; }).sort(byName);
    if (!ids.length) { el.innerHTML = head + '<div class="card muted">Nobody has spent anything in ' + esc(monthLabel(S.month)) + " yet.</div>"; return; }
    var rows = ids.map(function (p) {
      var n = calc.net[p.id] || 0;
      var b = n > 0 ? '<span class="badge pos">gets ' + money(n) + "</span>" : n < 0 ? '<span class="badge neg">owes ' + money(-n) + "</span>" : '<span class="badge zero">square</span>';
      return "<tr><td>" + who(p.id) + '</td><td class="r amt">' + money(calc.paid[p.id] || 0) + '</td><td class="r amt">' + money(calc.share[p.id] || 0) + '</td><td class="r">' + b + "</td></tr>";
    }).join("");
    el.innerHTML = head + '<div class="card"><div class="tablewrap"><table><thead><tr><th>Person</th><th class="r">Paid out</th><th class="r">Their share</th><th class="r">Net</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<p class="note">Paid out is what the person put down. Their share is their cut of every expense they were part of.</p></div>';
  }

  function renderLog() {
    var el = $("log");
    var ms = monthExpenses();
    var all = S.users.length;
    var head = '<div class="sechead"><h2>Expenses in ' + esc(monthLabel(S.month)) + '</h2><div class="headbtns">' +
      '<button type="button" class="btn small" data-act="csv-month">Download month (CSV)</button>' +
      '<button type="button" class="btn small" data-act="csv-all">Download everything (CSV)</button>' +
      '<button type="button" class="btn primary" data-act="add"' + (allReady() ? "" : " disabled") + '>+ Add expense</button></div></div>';
    if (!allReady()) { el.innerHTML = head + '<div class="card empty">Loading the ledger…</div>'; return; }
    if (!ms.length) { el.innerHTML = head + '<div class="card empty">Nothing logged for ' + esc(monthLabel(S.month)) + ". Whoever paid for the last outing can add it with the button above.</div>"; return; }
    var rows = ms.map(function (e) {
      var ppl = (e.people || []);
      var everyone = all > 1 && ppl.length === all && S.users.every(function (u) { return ppl.indexOf(u.id) >= 0; });
      var grp = everyone ? null : groupMatching(ppl);
      var withHtml = everyone ? '<span class="muted">Everyone (' + all + ")</span>" :
        grp ? '<span class="muted" title="' + esc(ppl.map(mName).join(", ")) + '">' + esc(grp.name) + " (" + ppl.length + ")</span>" :
        ppl.map(function (id) { return '<span title="' + esc(mName(id)) + '">' + chip(id, true) + "</span>"; }).join("");
      var each = ppl.length ? Math.round(e.paise / ppl.length) : 0;
      var act = '<button type="button" class="btn small" data-act="edit" data-id="' + esc(e.id) + '">Edit</button>' +
        '<button type="button" class="btn small danger' + (S.delId === e.id ? " on" : "") + '" data-act="del" data-id="' + esc(e.id) + '">' + (S.delId === e.id ? "Confirm delete" : "Delete") + "</button>";
      return '<li class="x"><div class="x-date">' + esc(dateLabel(e.date)) + '</div><div class="x-main"><strong>' + esc(e.name) + "</strong>" +
        (e.remarks ? '<span class="rem">' + esc(e.remarks) + "</span>" : "") + '</div><div class="x-who"><span class="lbl">Paid by</span>' + who(e.payer) +
        '</div><div class="x-with"><span class="lbl">Split</span>' + withHtml + '</div><div class="x-amt amt">' + money(e.paise) +
        "<small>" + money(each) + " each</small></div>" + '<div class="x-act">' + act + "</div></li>";
    }).join("");
    el.innerHTML = head + '<div class="card" style="padding:0"><ul class="log">' + rows + "</ul></div>";
  }

  function renderAccount() {
    var el = $("account"), p = me();
    if (!p) { el.innerHTML = ""; return; }
    if (S.nameOpen) {
      el.innerHTML = '<form class="card" id="nameForm" novalidate><div class="sechead"><h2>Your name</h2></div>' +
        '<div class="field" style="max-width:320px"><label for="n-name">Shown to everyone on expenses</label><input type="text" id="n-name" maxlength="24" value="' + esc(p.name) + '" autocomplete="name"></div>' +
        '<div class="formfoot"><button type="submit" class="btn primary">Save name</button><button type="button" class="btn" data-act="name-close">Cancel</button><span class="err" id="n-err"></span></div></form>';

    }
    el.innerHTML = '<div class="acct"><span class="muted">Signed in as</span>' + who(p.id) + '<span class="muted">' + esc(S.user.email) + "</span>" +

  /* ---------- groups: saved sets of people for quick picking ---------- */
  // Members who still have an account, so a group never selects someone the form cannot show.
  function groupPeople(g) { return g.members.filter(function (id) { return !!userById(id); }); }
  function sameSet(a, b) { return a.length === b.length && a.every(function (id) { return b.indexOf(id) >= 0; }); }
  function groupMatching(ids) {
    for (var i = 0; i < S.groups.length; i++) { var gp = groupPeople(S.groups[i]); if (gp.length > 1 && sameSet(gp, ids)) return S.groups[i]; }
    return null;
  }

  function renderGroups() {
    var el = $("groups");
    var head = '<div class="sechead"><h2>Groups</h2>' + (S.groupEdit ? "" : '<button type="button" class="btn small" data-act="group-new"' + (allReady() ? "" : " disabled") + ">+ New group</button>") + "</div>";
    if (!allReady()) { el.innerHTML = ""; return; }
    if (S.groupEdit) {
      var g = S.groupEdit === "new" ? null : findIn(S.groups, S.groupEdit);
      var sel = g ? g.members : [];
      var picks = S.users.map(function (u) {
        return '<label class="pick" title="' + esc(u.email) + '"><input type="checkbox" name="gperson" value="' + esc(u.id) + '"' + (sel.indexOf(u.id) >= 0 ? " checked" : "") + ">" + chip(u.id, true) + "<span>" + esc(u.name) + "</span></label>";
      }).join("");
      el.innerHTML = head + '<form class="card formcard" id="groupForm" novalidate><div class="sechead"><h2>' + (g ? "Edit group" : "New group") + "</h2></div>" +
        '<div class="field" style="max-width:360px"><label for="g-name">Group name</label><input type="text" id="g-name" maxlength="40" placeholder="Boys Flat, Office, Goa trip…" value="' + esc(g ? g.name : "") + '" autocomplete="off"></div>' +
        '<div class="field" style="margin-top:14px"><div class="legend">People in this group</div><div class="picks" role="group" aria-label="People in this group">' + picks + "</div></div>" +
        '<div class="formfoot"><button type="submit" class="btn primary">' + (g ? "Save group" : "Create group") + '</button><button type="button" class="btn" data-act="group-cancel">Cancel</button><span class="err" id="g-err"></span></div></form>';
      return;
    }
    if (!S.groups.length) {
      el.innerHTML = head + '<div class="card muted">No groups yet. Make one, like "Boys Flat", to pick all its people in one click when adding an expense.</div>';
      return;
    }
    var rows = S.groups.map(function (g) {
      var gp = groupPeople(g);
      var ppl = gp.length ? gp.map(function (id) { return '<span class="who" style="margin-right:10px">' + chip(id, true) + "<span>" + esc(mName(id)) + "</span></span>"; }).join("") : '<span class="muted">Nobody</span>';
      var del = S.groupDelId === g.id;
      return '<li class="grouprow"><strong>' + esc(g.name) + '</strong><div class="x-with">' + ppl + '</div><div class="x-act">' +
        '<button type="button" class="btn small" data-act="group-edit" data-id="' + esc(g.id) + '">Edit</button>' +
        '<button type="button" class="btn small danger' + (del ? " on" : "") + '" data-act="group-del" data-id="' + esc(g.id) + '">' + (del ? "Confirm delete" : "Delete") + "</button></div></li>";
    }).join("");
    el.innerHTML = head + '<div class="card" style="padding:0"><ul class="grouplist">' + rows + "</ul></div>" +
      '<p class="note">Groups are shortcuts for the expense form. Anyone can edit them, and changing a group does not change past expenses.</p>';
  }
  function openGroupForm(id) {
    S.groupEdit = id || "new"; S.groupDelId = null; renderGroups();
    var f = $("groupForm"); if (f) { f.scrollIntoView({ block: "nearest" }); $("g-name").focus(); }
  }
  function closeGroupForm() { S.groupEdit = null; renderGroups(); }
  function saveGroup() {
    var name = $("g-name").value.trim().slice(0, 40), err = $("g-err");
    var ids = Array.prototype.slice.call(document.querySelectorAll("#groupForm input[name=gperson]:checked")).map(function (i) { return i.value; });
    var editId = S.groupEdit === "new" ? null : S.groupEdit;
    if (!name) { err.textContent = "Give the group a name."; $("g-name").focus(); return; }
    if (S.groups.some(function (g) { return g.id !== editId && g.name.toLowerCase() === name.toLowerCase(); })) { err.textContent = "There is already a group with this name."; return; }
    if (ids.length < 2) { err.textContent = "Pick at least two people."; return; }
    var old = editId ? findIn(S.groups, editId) : null;
    var id = editId || S.root.child("groups").push().key;
    var mm = {}; ids.forEach(function (p) { mm[p] = true; });
    var now = Date.now();
    S.root.child("groups/" + id).set({
      name: name, members: mm,
      createdAt: old && old.createdAt ? old.createdAt : now, createdBy: old && old.createdBy ? old.createdBy : uid(),
      updatedAt: now, updatedBy: uid()
    }).catch(function (e) { toast(errText(e)); });
    S.groupEdit = null; renderGroups(); toast(editId ? "Group saved" : "Group created");
  }
  function deleteGroup(id) {
    S.groupDelId = null;
    S.root.child("groups/" + id).remove().catch(function (e) { toast(errText(e)); });
    toast("Group deleted");
  }

  function render() {
    renderHead(); renderBanner(); renderAuth();
    var ready = S.phase === "ready";
    $("cols").hidden = !ready;
    if (!ready) {
      $("settle").innerHTML = $("balances").innerHTML = $("log").innerHTML = $("groups").innerHTML = $("account").innerHTML = "";
      if (S.editing !== null || !$("formWrap").hidden) closeForm();
      return;
    }
    renderSettle(); renderBalances(); renderLog();
    if (!S.groupEdit) renderGroups();
    if (!S.nameOpen) renderAccount();
  }

  /* ---------- expense form ---------- */
  function openForm(id) {
    var e = id ? S.expenses.filter(function (x) { return x.id === id; })[0] : null;
    S.editing = e ? e.id : null;
    // Everyone with a verified account, plus any old-group names already on this expense.
    var list = S.users.slice();
    if (e) [e.payer].concat(e.people).forEach(function (pid) { if (pid && !findIn(list, pid)) list.push({ id: pid, name: mName(pid), email: "" }); });
    var payer = e ? e.payer : uid();
    var people = e ? e.people : S.users.map(function (u) { return u.id; });
    var defDate = e ? e.date : (S.month === ymNow() ? todayStr() : S.month + "-01");
    var payOpts = list.map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === payer ? " selected" : "") + ">" + esc(m.name) + (m.id === uid() ? " (you)" : "") + "</option>"; }).join("");
    var picks = list.map(function (m) {
      return '<label class="pick"' + (m.email ? ' title="' + esc(m.email) + '"' : "") + '><input type="checkbox" name="person" value="' + esc(m.id) + '"' + (people.indexOf(m.id) >= 0 ? " checked" : "") + ">" + chip(m.id, true) + "<span>" + esc(m.name) + "</span></label>";
    }).join("");
    var groupBtns = S.groups.length ? '<div class="groupbtns" role="group" aria-label="Pick a group"><span class="lbl">Groups</span>' + S.groups.map(function (g) {
      return '<button type="button" class="btn small" data-act="pick-group" data-id="' + esc(g.id) + '" title="' + esc(groupPeople(g).map(mName).join(", ")) + '">' + esc(g.name) + "</button>";
    }).join("") + "</div>" : "";
    var amtVal = e ? String(e.paise / 100) : "";
    var w = $("formWrap");
    w.innerHTML = '<form class="card formcard" id="expForm" novalidate><div class="sechead"><h2>' + (e ? "Edit expense" : "New expense") + "</h2></div>" +
      '<div class="formgrid">' +
      '<div class="field"><label for="f-date">Date</label><input type="date" id="f-date" value="' + esc(defDate) + '" required></div>' +
      '<div class="field name"><label for="f-name">Name of the expense</label><input type="text" id="f-name" maxlength="80" placeholder="Dinner at Social, cab to airport…" value="' + esc(e ? e.name : "") + '" autocomplete="off" required></div>' +
      '<div class="field"><label for="f-amt">Amount</label><div class="amtwrap"><span>₹</span><input type="text" id="f-amt" inputmode="decimal" placeholder="0" value="' + esc(amtVal) + '" autocomplete="off" required></div></div>' +
      '<div class="field"><label for="f-payer">Paid by</label><select id="f-payer">' + payOpts + "</select></div>" +
      '<div class="field full"><div class="legend">People involved <span class="quick">· <button type="button" class="linkbtn" data-act="pick-all">everyone</button> · <button type="button" class="linkbtn" data-act="pick-none">clear</button></span></div>' + groupBtns + '<div class="picks" role="group" aria-label="People involved">' + picks + "</div></div>" +
      '<div class="field full"><label for="f-rem">Remarks</label><textarea id="f-rem" rows="2" maxlength="200" placeholder="Optional. Who ordered extra, what the bill included…">' + esc(e ? e.remarks || "" : "") + "</textarea></div></div>" +
      '<div class="formfoot"><button type="submit" class="btn primary" id="f-save">' + (e ? "Save changes" : "Add expense") + '</button><button type="button" class="btn" data-act="form-cancel">Cancel</button><span class="grow" id="f-note"></span></div><div class="err" id="f-err" style="margin-top:8px"></div></form>';
    w.hidden = false; updateSplitNote();
    $("f-name").focus();
    w.scrollIntoView({ block: "nearest" });
  }
  function closeForm() { S.editing = null; var w = $("formWrap"); w.hidden = true; w.innerHTML = ""; }
  function parseAmount(v) {
    v = String(v || "").replace(/[,\s₹]/g, "");
    if (!/^\d+(\.\d{1,2})?$/.test(v)) return 0;
    return Math.round(parseFloat(v) * 100);
  }
  function checkedPeople() {
    return Array.prototype.slice.call(document.querySelectorAll("#formWrap input[name=person]:checked")).map(function (i) { return i.value; });
  }
  function updateSplitNote() {
    var n = $("f-note"); if (!n) return;
    var sel = checkedPeople();
    // Highlight the group whose people are exactly the current selection.
    Array.prototype.forEach.call(document.querySelectorAll("#formWrap [data-act=pick-group]"), function (b) {
      var g = findIn(S.groups, b.getAttribute("data-id"));
      var on = !!g && sameSet(groupPeople(g), sel);
      b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    var p = parseAmount($("f-amt").value), c = sel.length;
    if (!c) n.textContent = "Pick at least one person to split between.";
    else if (!p) n.textContent = c + (c === 1 ? " person" : " people") + " selected.";
    else n.textContent = "Split equally: about " + money(Math.round(p / c)) + " each between " + c + (c === 1 ? " person." : " people.");
  }
  function saveExpense() {
    var date = $("f-date").value, name = $("f-name").value.trim(), paise = parseAmount($("f-amt").value);
    var payer = $("f-payer").value, people = checkedPeople(), rem = $("f-rem").value.trim();
    var err = $("f-err");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { err.textContent = "Choose the date of the expense."; return; }
    if (!name) { err.textContent = "Give the expense a name."; $("f-name").focus(); return; }
    if (!paise) { err.textContent = "Enter an amount above zero, like 1250 or 1250.50."; $("f-amt").focus(); return; }
    if (!people.length) { err.textContent = "Select at least one person who shared this expense."; return; }
    var old = S.editing ? S.expenses.filter(function (x) { return x.id === S.editing; })[0] : null;
    var id = S.editing || S.root.child("expenses").push().key;
    var now = Date.now();
    var pm = {}; people.forEach(function (p) { pm[p] = true; });
    var wasEdit = !!S.editing;
    S.month = date.slice(0, 7);
    S.root.child("expenses/" + id).set({
      date: date, name: name, paise: paise, payer: payer, people: pm, remarks: rem,
      createdAt: old && old.createdAt ? old.createdAt : now, createdBy: old && old.createdBy ? old.createdBy : uid(),
      updatedAt: now, updatedBy: uid()
    }).catch(function (e) { toast(errText(e)); });
    closeForm(); render(); toast(wasEdit ? "Expense updated" : "Expense added");
  }

  /* ---------- actions ---------- */
  // Move every past expense and Paid tick from an old-group name to the signed-in account, in one atomic update.
  function claimLegacy(oldId) {
    var newId = uid(), up = {};
    S.expenses.forEach(function (e) {
      if (e.payer === oldId) up["expenses/" + e.id + "/payer"] = newId;
      if (e.people.indexOf(oldId) >= 0) { up["expenses/" + e.id + "/people/" + oldId] = null; up["expenses/" + e.id + "/people/" + newId] = true; }
    });
    Object.keys(S.settled).forEach(function (m) {
      Object.keys(S.settled[m] || {}).forEach(function (k) {
        var p = k.split("_");
        if (p.length !== 3 || (p[0] !== oldId && p[1] !== oldId)) return;
        up["settled/" + m + "/" + k] = null;
        up["settled/" + m + "/" + (p[0] === oldId ? newId : p[0]) + "_" + (p[1] === oldId ? newId : p[1]) + "_" + p[2]] = true;
      });
    });
    up["members/" + oldId + "/claimedBy"] = newId;
    up["users/" + newId + "/legacyDone"] = true;
    S.claimId = null;
    S.root.update(up).then(function () { toast("Past expenses moved to your account"); }, function (e) { toast(errText(e)); });
  }
  function skipClaim() {
    S.root.child("users/" + uid() + "/legacyDone").set(true).catch(function (e) { toast(errText(e)); });
  }
  function saveName() {
    var v = $("n-name").value.trim().slice(0, 24), err = $("n-err");
    if (!v) { err.textContent = "Enter a name."; return; }
    S.root.child("users/" + uid() + "/name").set(v).catch(function (e) { toast(errText(e)); });
    S.user.updateProfile({ displayName: v }).catch(function () { /* the database copy is what others see */ });
    S.nameOpen = false; renderAccount(); toast("Name updated");
  }
  function togglePaid(key, on) {
    var ref = S.root.child("settled/" + S.month + "/" + key);
    (on ? ref.set(true) : ref.remove()).catch(function (e) { toast(errText(e)); });
  }
  function deleteExpense(id) {
    S.delId = null;
    S.root.child("expenses/" + id).remove().catch(function (e) { toast(errText(e)); });
    toast("Expense deleted");
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta); toast(ok ? "Summary copied" : "Could not copy. Select the payments and copy them by hand.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("Summary copied"); }, fallback);
    } else fallback();
  }
  function copySummary() {
    var ms = monthExpenses(), calc = currentCalc(), done = S.settled[S.month] || {};
    var total = ms.reduce(function (a, e) { return a + e.paise; }, 0);
    var lines = ["Expense Tracker – " + monthLabel(S.month), "Total spent: " + money(total), ""];
    if (!calc.transfers.length) lines.push("Everyone is square.");
    else { lines.push("Settle up:"); calc.transfers.forEach(function (t) { lines.push(mName(t.from) + " pays " + mName(t.to) + " " + money(t.paise) + (done[tKey(t)] ? " (paid)" : "")); }); }
    copyText(lines.join("\n"));
  }
  function csvCell(v) {
    v = String(v == null ? "" : v);
    if (/^[=+\-@]/.test(v)) v = "'" + v;
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function downloadCsv(all) {
    var list = (all ? S.expenses.slice() : monthExpenses().slice())
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0); });
    var rows = [["Date", "Expense", "Amount (INR)", "Paid by", "People involved", "Remarks"]];
    list.forEach(function (e) {
      rows.push([e.date, e.name, (e.paise / 100).toFixed(2), mName(e.payer), (e.people || []).map(mName).join("; "), e.remarks || ""]);
    });
    var text = "﻿" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
    var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "expense-tracker-" + (all ? "all" : S.month) + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("Download started");
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]");
    if (!b) {
      if (S.delId) { S.delId = null; renderLog(); }
      if (S.groupDelId) { S.groupDelId = null; renderGroups(); }
      return;
    }
    var act = b.getAttribute("data-act");
    if (act !== "del" && S.delId) { S.delId = null; renderLog(); }
    if (act !== "claim" && S.claimId) { S.claimId = null; renderBanner(); }
    if (act !== "group-del" && S.groupDelId) { S.groupDelId = null; renderGroups(); }
    switch (act) {
      case "theme": setTheme(currentTheme() === "dark" ? "light" : "dark"); break;
      case "prev": S.month = shiftMonth(S.month, -1); render(); break;
      case "next": S.month = shiftMonth(S.month, 1); render(); break;
      case "add": openForm(null); break;
      case "edit": openForm(b.getAttribute("data-id")); break;
      case "form-cancel": closeForm(); break;
      case "pick-all": Array.prototype.forEach.call(document.querySelectorAll("#formWrap input[name=person]"), function (i) { i.checked = true; }); updateSplitNote(); break;
      case "pick-none": Array.prototype.forEach.call(document.querySelectorAll("#formWrap input[name=person]"), function (i) { i.checked = false; }); updateSplitNote(); break;
      case "del": {
        var id = b.getAttribute("data-id");
        if (S.delId === id) deleteExpense(id); else { S.delId = id; renderLog(); }
        break;
      }
      case "paid": togglePaid(b.getAttribute("data-key"), b.checked); break;
      case "copy": copySummary(); break;
      case "csv-month": downloadCsv(false); break;
      case "csv-all": downloadCsv(true); break;
      case "auth-mode": {
        var email = val("a-email");
        S.authMode = b.getAttribute("data-mode"); renderAuth();
        if ($("a-email")) { $("a-email").value = email; }
        var first = document.querySelector("#authForm input"); if (first) first.focus();
        break;
      }
      case "verify-check": checkVerified(false); break;
      case "verify-resend": resendVerification(); break;
      case "signout": S.auth.signOut(); break;
      case "claim": {
        var cid = b.getAttribute("data-id");
        if (S.claimId === cid) claimLegacy(cid); else { S.claimId = cid; renderBanner(); }
        break;
      }
      case "claim-skip": skipClaim(); break;
      case "name-open": S.nameOpen = true; renderAccount(); $("n-name").focus(); break;
      case "name-close": S.nameOpen = false; renderAccount(); break;
      case "pick-group": {
        var pg = findIn(S.groups, b.getAttribute("data-id"));
        if (pg) { var gp = groupPeople(pg); Array.prototype.forEach.call(document.querySelectorAll("#formWrap input[name=person]"), function (i) { i.checked = gp.indexOf(i.value) >= 0; }); }
        updateSplitNote(); break;
      }
      case "group-new": openGroupForm(null); break;
      case "group-edit": openGroupForm(b.getAttribute("data-id")); break;
      case "group-cancel": closeGroupForm(); break;
      case "group-del": {
        var gid = b.getAttribute("data-id");
        if (S.groupDelId === gid) deleteGroup(gid); else { S.groupDelId = gid; renderGroups(); }
        break;
      }
    }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "monthSel") { S.month = ev.target.value; render(); }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.closest && ev.target.closest("#expForm")) updateSplitNote();
  });
  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target;
    if (f.id === "expForm") saveExpense();
    else if (f.id === "nameForm") saveName();
    else if (f.id === "groupForm") saveGroup();
    else if (f.id === "authForm" && !S.busy) {
      var mode = f.getAttribute("data-mode");
      if (mode === "signup") signUp(); else if (mode === "reset") resetPassword(); else signIn();
    }
  });
  // Coming back from the verification email in another tab: pick it up without a click.
  window.addEventListener("focus", function () { if (S.phase === "unverified") checkVerified(true); });

  /* ---------- live data from Firebase ---------- */
  function onErr(e) {
    S.err = /permission/i.test((e && (e.code || e.message)) || "")
      ? "The database refused to share its data. Publish the rules from database.rules.json under Realtime Database → Rules in the Firebase console."
      : "Could not load the ledger right now. Reload the page to try again.";
    S.ready = { u: true, l: true, e: true, s: true, g: true }; render();
  }
  function detachData() {
    S.refs.forEach(function (r) { r.off(); });
    S.refs = []; S.users = []; S.legacy = []; S.expenses = []; S.settled = {}; S.groups = [];
    S.ready = { u: false, l: false, e: false, s: false, g: false };
    S.groupEdit = null; S.groupDelId = null;
    S.err = "";
  }
  function attachData(u) {
    function listen(path, cb) { var r = S.root.child(path); r.on("value", cb, onErr); S.refs.push(r); }
    listen("users", function (snap) {
      var v = snap.val() || {};
      S.users = Object.keys(v).map(function (id) {
        var x = v[id] || {};
        return { id: id, name: String(x.name || "Unnamed"), email: String(x.email || ""), legacyDone: !!x.legacyDone };
      }).sort(byName);
      S.ready.u = true; render();
    });
    listen("members", function (snap) {
      var v = snap.val() || {};
      S.legacy = Object.keys(v).map(function (id) { var x = v[id] || {}; return { id: id, name: String(x.name || "Unnamed"), claimedBy: x.claimedBy || null }; });
      S.ready.l = true; render();
    });
    listen("expenses", function (snap) {
      var v = snap.val() || {};
      S.expenses = Object.keys(v).map(function (id) {
        var x = v[id] || {};
        return { id: id, date: x.date, name: x.name, paise: x.paise, payer: x.payer, people: Object.keys(x.people || {}), remarks: x.remarks || "", createdAt: x.createdAt || 0, createdBy: x.createdBy || "" };
      });
      S.ready.e = true; render();
    });
    listen("groups", function (snap) {
      var v = snap.val() || {};
      S.groups = Object.keys(v).map(function (id) {
        var x = v[id] || {};
        return { id: id, name: String(x.name || "Unnamed group"), members: Object.keys(x.members || {}), createdAt: x.createdAt || 0, createdBy: x.createdBy || "" };
      }).sort(byName);
      S.ready.g = true; render();
    });
    listen("settled", function (snap) {
      S.settled = snap.val() || {}; S.ready.s = true; render();
    });
    // First verified sign-in creates the profile that puts this person in everyone's expense form.
    var ref = S.root.child("users/" + u.uid);
    ref.once("value").then(function (snap) {
      if (snap.exists()) return snap.child("email").val() === u.email ? null : ref.child("email").set(u.email);
      var name = String(u.displayName || u.email.split("@")[0] || "Me").trim().slice(0, 24);
      return ref.set({ name: name, email: u.email, createdAt: Date.now() });
    }).catch(function (e) { toast(errText(e)); });
  }
  function onUser(u) {
    detachData();
    S.user = u || null; S.nameOpen = false; S.claimId = null; S.busy = false;
    if (!u) S.phase = "signedOut";
    else if (!u.emailVerified) S.phase = "unverified";
    else { S.phase = "ready"; attachData(u); }
    render();
    // The cached user can be stale if the link was opened since the last visit.
    if (u && !u.emailVerified) checkVerified(true);
  }
  function start() {
    var cfg = FIREBASE_CONFIG;
    if (!cfg.apiKey || /PASTE_YOUR/.test(cfg.apiKey) || !cfg.databaseURL) { S.setup = true; render(); return; }
    if (typeof firebase === "undefined" || !firebase.auth) { S.err = "Could not load Firebase. Check your internet connection and reload."; render(); return; }
    try {
      firebase.initializeApp(cfg);
      var database = firebase.database();
      S.root = database.ref("ledger");
      S.auth = firebase.auth();
      database.ref(".info/connected").on("value", function (s) { S.online = s.val() === true; renderBanner(); });
      S.auth.onAuthStateChanged(onUser);
    } catch (e) {
      S.err = "Could not connect to Firebase. Check the config at the top of this file."; render();
    }
  }
  render();
  start();
})();

</script>
</body>
</html>
